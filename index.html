<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C1A24">
<meta name="description" content="Piano di allenamento per la StraGardaLake 21K">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>StraGarda 21K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C1A24; --s1:#132634; --s2:#1A3243; --line:#24404F; --tx:#EAF1F5; --mu:#8EA6B5; --dim:#5F7A8A;
  --lemon:#F2D24B; --ink:#14130A; --paper:#F3F4EE;
  --easy:#4FC3A1; --quality:#F0A93B; --long:#9B8CFF; --strides:#7FE0C2; --race:#F2D24B;
  --strength:#5AA9FF; --functional:#5AA9FF; --hyrox:#FF6F6F; --home:#7DB8FF; --core:#7DB8FF;
  --swim:#36C9E0; --recovery:#9DB4C2; --rest:#3B5566;
  --ok:#4FC3A1; --warn:#F0A93B; --bad:#FF6F6F;
  --cond:"Barlow Condensed",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom));min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--lemon);outline-offset:2px}
h1,h2,h3{font-family:var(--cond);font-weight:700;letter-spacing:.2px;line-height:1.15}
a{color:var(--lemon)}

.top{position:sticky;top:0;z-index:20;background:rgba(12,26,36,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--cond);font-weight:700;font-size:1.35rem}
.brand span{color:var(--lemon)}
.top-week{font-size:.9rem;color:var(--mu)}
main{max-width:680px;margin:0 auto;padding:14px 16px 24px}
.view{display:none}.view.active{display:block}
.sec-h{font-size:1.3rem;margin:22px 0 10px}
.muted{color:var(--mu)} .small{font-size:.85rem}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--s1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--mu);font-size:.78rem;font-weight:600;min-height:58px}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=page]{color:var(--lemon)}

/* bib hero */
.bib{position:relative;background:var(--paper);color:var(--bg);border-radius:14px;padding:22px 24px 18px;margin-bottom:16px;overflow:hidden}
.pin{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid #9AA6A0;background:#DCE0D8}
.pin.a{top:10px;left:10px}.pin.b{top:10px;right:10px}.pin.c{bottom:10px;left:10px}.pin.d{bottom:10px;right:10px}
.bib-race{font-family:var(--cond);font-weight:700;font-size:1.05rem;color:#3C4E58}
.bib-row{display:flex;align-items:flex-end;gap:14px;margin:4px 0 6px}
.bib-num{font-family:var(--cond);font-weight:700;font-size:6rem;line-height:.85;letter-spacing:-2px}
.bib-lab{font-size:1rem;font-weight:600;line-height:1.25;padding-bottom:6px}
.bib-meta{font-size:.88rem;color:#3C4E58}
.bib-stripe{height:6px;background:var(--lemon);margin:12px -24px -18px}

.banner{background:var(--s2);border:1px solid var(--line);border-left:4px solid var(--lemon);border-radius:10px;padding:12px 14px;margin:12px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}
.progress{background:var(--s1);border-radius:12px;padding:14px;margin:12px 0}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--lemon);border-radius:5px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi b{display:block;font-family:var(--cond);font-size:1.6rem;line-height:1.1}
.kpi span{font-size:.8rem;color:var(--mu)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:22px;font-weight:600;font-size:.92rem;background:var(--s2);border:1px solid var(--line);color:var(--tx)}
.btn.pri{background:var(--lemon);color:var(--ink);border-color:var(--lemon)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(255,111,111,.4);background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* week pills */
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;text-align:center;border:1px solid var(--line);background:var(--s1);border-radius:12px;padding:6px 12px;min-width:58px}
.pill b{display:block;font-family:var(--cond);font-size:1.1rem;line-height:1.1}
.pill span{font-size:.72rem;color:var(--mu)}
.pill.on{background:var(--lemon);border-color:var(--lemon);color:var(--ink)}
.pill.on span{color:#4A4520}
.pill.now:not(.on){border-color:var(--lemon)}
.week-h{background:var(--s1);border-radius:12px;padding:14px;margin-bottom:6px}
.week-h h2{font-size:1.5rem}
.week-tools{display:flex;justify-content:space-between;align-items:center;margin:10px 0 2px;gap:8px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;color:var(--mu)}
.switch input{width:40px;height:22px;accent-color:var(--lemon)}

/* day */
.day{margin-top:18px}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.day-h h3{font-size:1.2rem}
.day-h .tag{font-size:.75rem;font-weight:600;background:var(--lemon);color:var(--ink);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.day-note{font-size:.85rem;color:var(--mu);margin:-2px 0 6px}

/* session card */
.sess{background:var(--s1);border-radius:12px;border-left:4px solid var(--c,var(--rest));padding:13px 14px 12px;margin-bottom:10px}
.sess.done{background:linear-gradient(0deg,rgba(79,195,161,.06),rgba(79,195,161,.06)),var(--s1)}
.sess-top{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--mu)}
.sess-type{color:var(--c);font-weight:600}
.sess h4{font-family:var(--cond);font-size:1.3rem;font-weight:700;margin:2px 0 4px;line-height:1.15}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chips span{font-size:.78rem;background:var(--s2);border-radius:6px;padding:2px 8px;color:#C7D5DD}
.targets{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:8px 0;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.targets dt{font-size:.75rem;color:var(--mu)}
.targets dd{font-size:.92rem;font-weight:600;line-height:1.3}
.steps{list-style:none;counter-reset:st;margin:8px 0}
.steps>li{counter-increment:st;position:relative;padding-left:28px;margin:7px 0;font-size:.92rem;line-height:1.4}
.steps>li::before{content:counter(st);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:var(--s2);color:var(--c);font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.steps b{display:block;font-weight:600}
.steps ul{margin:4px 0 0 16px;color:#C7D5DD}
.steps ul li{margin:2px 0}
.fuel,.snote{font-size:.88rem;margin-top:6px;line-height:1.4}
.fuel b,.snote b{color:var(--mu);font-weight:600}
.adapt{font-size:.82rem;color:var(--lemon);margin-top:6px}
.sess-f{display:flex;align-items:center;gap:8px;margin-top:10px}
.check{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px 6px 8px;border-radius:22px;border:1px solid var(--line);font-weight:600;font-size:.9rem}
.check i{width:22px;height:22px;border-radius:6px;border:2px solid var(--mu);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:.85rem}
.sess.done .check i{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.sess.done .check i::after{content:"✓";font-weight:800}
.logline{margin-top:10px;padding:10px 12px;background:var(--s2);border-radius:10px;font-size:.88rem}
.fb{display:flex;gap:8px;margin-top:6px;font-size:.86rem;line-height:1.4}
.fb::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px;background:var(--fbc)}
.fb.ok{--fbc:var(--ok)}.fb.warn{--fbc:var(--warn)}.fb.bad{--fbc:var(--bad)}
.compact .targets,.compact .steps,.compact .fuel,.compact .snote{display:none}

/* activities */
.drop{display:block;width:100%;text-align:center;border:1.5px dashed var(--dim);border-radius:14px;padding:22px 16px;background:var(--s1)}
.drop b{font-family:var(--cond);font-size:1.3rem;display:block}
.act{background:var(--s1);border-radius:12px;padding:12px 14px;margin-bottom:10px;border-left:4px solid var(--c)}
.act-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.act-h h4{font-family:var(--cond);font-size:1.2rem}
.act-m{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0;border-top:1px solid var(--line);padding-top:8px}
.act-m dt{font-size:.72rem;color:var(--mu)} .act-m dd{font-weight:600;font-size:.95rem}
.act-ctl{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;margin-top:6px}
select,input[type=number],input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:.92rem}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.splits{font-size:.82rem;margin-top:6px}
.splits summary{color:var(--mu);cursor:pointer}
.splits table{width:100%;border-collapse:collapse;margin-top:6px}
.splits td,.splits th{padding:3px 4px;text-align:right;border-bottom:1px solid var(--line)}
.splits th{color:var(--mu);font-weight:500}
.wk-chart{background:var(--s1);border-radius:12px;padding:12px 14px}
.wk-row{display:grid;grid-template-columns:34px 1fr 70px;align-items:center;gap:8px;margin:5px 0;font-size:.82rem}
.wk-row .tr{position:relative;height:12px;background:var(--bg);border-radius:4px}
.wk-row .pl{position:absolute;inset:0 auto 0 0;border:1px solid var(--dim);border-radius:4px}
.wk-row .dn{position:absolute;inset:2px auto 2px 2px;background:var(--easy);border-radius:3px}
.wk-row .nb{text-align:right;color:var(--mu)}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--mu);margin-top:6px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}

/* tools */
details.tool{background:var(--s1);border-radius:12px;margin-bottom:10px}
details.tool>summary{list-style:none;padding:14px;font-family:var(--cond);font-size:1.2rem;font-weight:700;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.tool>summary::-webkit-details-marker{display:none}
details.tool>summary::after{content:"+";color:var(--mu);font-size:1.4rem}
details.tool[open]>summary::after{content:"–"}
.tool-b{padding:0 14px 14px}
.zt{width:100%;border-collapse:collapse;font-size:.85rem}
.zt td,.zt th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.zt th{color:var(--mu);font-weight:500;font-size:.75rem}
.zt b{font-family:var(--cond);font-size:1.05rem}
.proto{margin:10px 0 16px}
.proto h4{font-family:var(--cond);font-size:1.1rem}
.proto ol,.proto ul{margin:6px 0 0 20px;font-size:.9rem}
.proto li{margin:3px 0}
.res{border-radius:10px;padding:12px;background:var(--s2);margin:10px 0}
.res h4{font-family:var(--cond);font-size:1.15rem}
.field{display:block;margin:8px 0}
.field span{display:block;font-size:.78rem;color:var(--mu);margin-bottom:3px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,12,17,.72);z-index:50;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--s1);border-radius:18px 18px 0 0;max-height:90vh;overflow-y:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease}
.sheet:not(.on){visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.sheet.on{transform:none;visibility:visible}
.sheet-in{max-width:680px;margin:0 auto}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--paper);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:60;max-width:90vw;display:none;box-shadow:0 6px 20px rgba(0,0,0,.35);white-space:pre-line}
.toast.on{display:block}
.empty{text-align:center;color:var(--mu);padding:20px 10px}

#print{display:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
@media print{
  @page{size:A4 landscape;margin:7mm}
  body{background:#fff;color:#000;padding:0;font-size:8pt}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000}
  #print h1{font-size:13pt;margin-bottom:2mm}
  #print p{font-size:8pt;margin-bottom:2mm}
  #print table{width:100%;border-collapse:collapse;font-size:7pt;line-height:1.25}
  #print th{background:#E6EAE4;font-weight:700}
  #print th,#print td{border:.5pt solid #9AA;padding:1.2mm 1.4mm;vertical-align:top;text-align:left}
  #print tr{break-inside:avoid}
  #print thead{display:table-header-group}
  #print .wk td{background:#F3F4EE;font-weight:700}
  #print .pg{break-before:page}
  #print .cols{columns:2;column-gap:8mm;font-size:8pt}
  #print .cols h3{font-size:10pt;margin-top:3mm}
  #print .cols li{margin-left:4mm}
}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand">StraGarda <span>21K</span></div><div class="top-week" id="topWeek"></div></div></header>

<main>
  <section id="v-oggi" class="view active" aria-label="Oggi"></section>
  <section id="v-piano" class="view" aria-label="Piano"></section>
  <section id="v-attivita" class="view" aria-label="Attività"></section>
  <section id="v-strumenti" class="view" aria-label="Strumenti"></section>
</main>

<nav class="tabs" aria-label="Sezioni">
  <button data-tab="oggi" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Oggi</button>
  <button data-tab="piano"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Piano</button>
  <button data-tab="attivita"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Attività</button>
  <button data-tab="strumenti"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Strumenti</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="print"></div>
<input type="file" id="fileIn" multiple hidden>
<input type="file" id="backupIn" hidden>

<script src="plan.js"></script>
<script>
"use strict";
const APP_V = "1.0.0";
const KEY = "sgl21k.v1";

/* ---------- utilità ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const localISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => localISO(new Date());
const D = iso => new Date(iso + "T12:00:00");
const daysBetween = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const WD = ["dom", "lun", "mar", "mer", "gio", "ven", "sab"];
const WDL = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
const MO = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
const fmtDay = iso => { const d = D(iso); return `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`; };
const fmtDayL = iso => { const d = D(iso); return `${WDL[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`; };
const fmtDM = iso => { const d = D(iso); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const nf = (x, dec = 1) => (x == null || x === "" || isNaN(x)) ? "—" : Number(x).toLocaleString("it-IT", { maximumFractionDigits: dec });
const fmtDur = sec => { if (!sec) return "—"; sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? `${h}h${pad(m)}'` : `${m}'${pad(s)}"`; };
const fmtPace = spk => { if (!spk || !isFinite(spk) || spk <= 0) return "—"; let m = Math.floor(spk / 60), s = Math.round(spk % 60); if (s === 60) { m++; s = 0; } return `${m}:${pad(s)}/km`; };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const weekOf = iso => Math.floor(daysBetween(PLAN_INFO.start, iso) / 7) + 1;
const NW = 11;
const RPE_L = ["", "1 Molto leggero", "2 Leggero", "3 Facile", "4 Facile-moderato", "5 Moderato", "6 Impegnativo", "7 Duro", "8 Molto duro", "9 Quasi massimo", "10 Massimo"];
const GOAL_L = { easy: "Corsa facile", long: "Lungo", strides: "Allunghi", quality: "Qualità", race: "Gara", strength: "Forza", functional: "Functional", hyrox: "Hyrox", home: "Forza a casa", core: "Core a casa", swim: "Nuoto", recovery: "Mobilità", rest: "Riposo", bike: "Bici" };
const SPORT_L = { run: "Corsa", swim: "Nuoto", strength: "Palestra / forza", bike: "Bici / cyclette", walk: "Camminata", other: "Altro" };
const SPORT_C = { run: "var(--easy)", swim: "var(--swim)", strength: "var(--strength)", bike: "var(--long)", walk: "var(--recovery)", other: "var(--rest)" };
const RUN_KINDS = ["run", "race"];
const MATCH = { run: ["run", "race"], swim: ["swim"], strength: ["gym", "home"], bike: ["bike"], walk: [], other: [] };
const isRun = s => RUN_KINDS.includes(s.kind);

/* ---------- stato ---------- */
let state = { logs: {}, acts: [], overrides: {}, swaps: {}, reviewed: {}, ui: { compact: false, week: null }, meta: { created: new Date().toISOString() } };
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); }
  catch (e) { console.warn(e); }
  state.ui = Object.assign({ compact: false, week: null }, state.ui || {});
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
  catch (e) { toast("Salvataggio non riuscito: memoria del browser piena o bloccata. Esporta un backup."); return false; }
}
let PLAN = [];
function buildPlan() {
  const days = PLAN_BASE.map(b => {
    const o = state.overrides[b.date];
    return { date: b.date, w: weekOf(b.date), note: (o && o.note != null) ? o.note : (b.note || ""), sessions: JSON.parse(JSON.stringify(o ? o.sessions : b.sessions)), adapted: o ? { src: o.src, at: o.at, why: o.why } : null };
  });
  for (const w of Object.keys(state.swaps)) {
    if (!state.swaps[w]) continue;
    const sat = days.find(d => d.w == w && D(d.date).getDay() === 6), sun = days.find(d => d.w == w && D(d.date).getDay() === 0);

function backupObj() { return { app: "stragarda21k", version: 1, appVersion: APP_V, exportedAt: new Date().toISOString(), state }; }
async function shareOrDownload(name, text, type) {
  try {
    const file = new File([text], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  download(name, text, type);
}
function stamp() { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`; }
function exportBackup(share) {
  const name = `stragarda21k_backup_${stamp()}.json`, txt = JSON.stringify(backupObj(), null, 1);
  state.meta.lastBackup = new Date().toISOString(); save();
  share ? shareOrDownload(name, txt, "application/json") : download(name, txt, "application/json");
}
async function importBackup(file) {
  try {
    const obj = JSON.parse(await file.text());
    const st = obj.state || obj;
    if (!st || !Array.isArray(st.acts)) throw new Error("non è un backup di questa app");
    let added = 0;
    st.acts.forEach(a => { if (!state.acts.some(x => x.id === a.id || isDup(x, a))) { state.acts.push(a); added++; } });
    Object.assign(state.logs, st.logs || {});
    Object.assign(state.overrides, st.overrides || {});
    Object.assign(state.swaps, st.swaps || {});
    Object.assign(state.reviewed, st.reviewed || {});
    sortActs(); save(); buildPlan(); renderAll();
    toast(`Backup ripristinato: ${added} attività aggiunte, registrazioni e modifiche del piano unite.`, 4500);
  } catch (e) { toast("Backup non valido: " + e.message, 4500); }
}

function weekSummary(w) {
  const st = weekStats(w), res = analyzeWeek(w), days = PLAN.filter(d => d.w === w);
  const L = [];
  L.push(`Riepilogo StraGarda 21K, settimana ${w} (${fmtDM(st.from)}–${fmtDM(st.to)}). App v${APP_V}.`);
  L.push(`Atleta: 30 anni, 186 cm, 86 kg. FC max stimata ${PLAN_INFO.hrMax}, FC a riposo ${PLAN_INFO.hrRest}. Ginocchia da proteggere. Gara ${PLAN_INFO.raceName} il 10/01/2027 alle 9:50 (251 m D+, collinare fino al km 13), obiettivo ${PLAN_INFO.goal}.`);
  L.push(`Corsa: previsti ${nf(st.plannedKm)} km, fatti ${nf(st.doneKm)} km. Sedute completate ${st.done}/${st.total}.`);
  L.push("");
  L.push("Sedute (previsto | fatto):");
  days.forEach(d => d.sessions.forEach(s => {
    if (s.kind === "rest") return;
    const lg = state.logs[s.id] || {}, acts = actsFor(s.id);
    let line = `- ${fmtDay(d.date)} | ${s.title} [${GOAL_L[s.goal] || s.goal}] | prev: ${s.durMin || "—"}'${isRun(s) ? `, ${s.km} km, FC ${s.hr || "—"}` : ""}, RPE ${s.rpe ? s.rpe.join("–") : "—"}`;
    if (!lg.done && !acts.length) line += " | NON FATTA";
    else {
      line += ` | fatto: ${lg.km ? lg.km + " km, " : ""}${lg.dur ? lg.dur + "', " : ""}FC ${lg.hr || "—"}, RPE ${lg.rpe || "—"}, dolore ${lg.pain || 0}/10`;
      acts.forEach(a => { line += ` | file: ${a.distKm} km in ${fmtDur(a.durSec)}${a.paceSec ? ", passo " + fmtPace(a.paceSec) : ""}, FC ${a.avgHr || "—"}/${a.maxHr || "—"}${a.drift != null ? ", deriva " + a.drift + "%" : ""}${a.cad ? ", cadenza " + a.cad : ""}${a.elev ? ", D+ " + a.elev + " m" : ""}`; if (a.splits && a.splits.length) line += `, split: ${a.splits.map(x => `${x.km}:${fmtPace(x.sec).replace("/km", "")}${x.hr ? "@" + x.hr : ""}`).join(" ")}`; });
      if (lg.note) line += ` | note: ${lg.note}`;
    }
    L.push(line);
  }));
  const ids = new Set(days.flatMap(d => d.sessions.map(s => s.id)));
  const extra = state.acts.filter(a => weekOf(a.date) === w && !(a.link && ids.has(a.link)));
  if (extra.length) { L.push(""); L.push("Attività non collegate al piano:"); extra.forEach(a => L.push(`- ${fmtDay(a.date)} ${a.time} ${SPORT_L[a.sport]}: ${a.distKm} km in ${fmtDur(a.durSec)}, FC ${a.avgHr || "—"}/${a.maxHr || "—"}`)); }
  L.push(""); L.push(`Analisi automatica: ${res.level}. ${res.text}`); res.flags.forEach(f => L.push(`- ${f}`));
  if (w < NW) {
    const next = PLAN.filter(d => d.w === w + 1).map(d => ({ date: d.date, note: d.note || undefined, sessions: d.sessions.map(s => { const c = Object.assign({}, s); delete c.id; delete c.date; delete c.w; return c; }) }));
    L.push(""); L.push(`Settimana ${w + 1} attualmente in piano (JSON):`); L.push(JSON.stringify(next));
    L.push("");
    L.push(`Richiesta: valuta la settimana ${w} e proponi la settimana ${w + 1} aggiornata (tutti e 7 i giorni). Rispondi con UN blocco json così: {"type":"stragarda-plan-update","note":"motivo in breve","days":[{"date":"AAAA-MM-GG","note":"","sessions":[{"kind":"run|race|gym|home|swim|mobility|rest","goal":"easy|long|strides|quality|race|strength|functional|hyrox|home|core|swim|recovery|rest","title":"","place":"","slot":"","durMin":0,"km":0,"pace":"","speed":"","hr":"","hrR":[0,0],"rpe":[0,0],"steps":[{"t":"","d":"","list":[]}],"fuel":"","note":""}]}]}`);
  }
  return L.join("\n");
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} ta.remove(); return ok; }
}
function parseUpdate(text) {
  const start = text.indexOf("{"), end = text.lastIndexOf("}");
  if (start < 0 || end < start) throw new Error("nessun JSON trovato nel testo incollato");
  const obj = JSON.parse(text.slice(start, end + 1));
  if (obj.type !== "stragarda-plan-update" || !Array.isArray(obj.days)) throw new Error("il JSON non è un aggiornamento del piano");
  const KINDS = ["run", "race", "gym", "home", "swim", "mobility", "rest", "bike"];
  obj.days.forEach(d => {
    if (!PLAN_BASE.some(b => b.date === d.date)) throw new Error(`data fuori piano: ${d.date}`);
    if (!Array.isArray(d.sessions) || !d.sessions.length) throw new Error(`nessuna seduta per il ${d.date}`);
    d.sessions.forEach(s => { if (!KINDS.includes(s.kind) || !s.title) throw new Error(`seduta non valida il ${d.date}`); if (!Array.isArray(s.steps)) s.steps = []; });
  });
  return obj;
}

    ${log}

}

    <label class="field"><span>Settimana da analizzare</span><select data-act="aweek">${wkOpts}</select></label>
    <div class="res"><h4>Esito: ${esc(res.level)}</h4><p class="small">${esc(res.text)}</p>${res.flags.length ? `<ul class="small" style="margin:6px 0 0 18px">${res.flags.map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}</div>
    ${aw < NW && res.level !== "nessun dato" ? `<div class="btn-row">${res.factor < 1 ? `<button class="btn pri sm" data-act="applyrules" data-w="${aw}">Applica alla settimana ${aw + 1}</button>` : `<button class="btn sm" data-act="markreviewed" data-w="${aw}">Segna come analizzata</button>`}<button class="btn sm ghost" data-act="resetweek" data-w="${aw + 1}">Ripristina settimana ${aw + 1}</button></div>` : ""}
    <h4 style="font-family:var(--cond);font-size:1.1rem;margin-top:16px">Revisione con Claude</h4>
    <p class="small muted">1. Copia il riepilogo e incollalo nella chat con Claude. 2. Copia il blocco JSON che ti risponde e incollalo qui sotto.</p>
    <div class="btn-row"><button class="btn sm pri" data-act="copysum" data-w="${aw}">Copia riepilogo settimana ${aw}</button></div>
    <label class="field" style="margin-top:12px"><span>Risposta di Claude (JSON)</span><textarea id="updIn" placeholder='{"type":"stragarda-plan-update", ...}'></textarea></label>
    <div class="btn-row"><button class="btn sm" data-act="preview">Controlla aggiornamento</button></div>
    <div id="updPrev"></div>
  </div></details>

  <details class="tool"><summary>Zone di frequenza cardiaca e ritmi</summary><div class="tool-b">
    <p class="small muted">Metodo Karvonen con FC max stimata ${PLAN_INFO.hrMax} e FC a riposo ${PLAN_INFO.hrRest}. La FC max è una stima: se in una gara o in un Hyrox vedi valori più alti, scrivilo a Claude per ricalcolare le zone. Sul tapis usa sempre pendenza 1%.</p>
    <table class="zt"><tr><th>Zona</th><th>FC</th><th>Passo</th><th>Tapis</th></tr>${ZONES.map(z => `<tr><td><b>${z.k}</b><br><span class="small muted">${esc(z.n)}</span></td><td>${esc(z.hr)}</td><td>${esc(z.pace)}</td><td>${esc(z.spd)}</td></tr><tr><td></td><td colspan="3" class="small muted" style="padding-top:0">${esc(z.use)}</td></tr>`).join("")}</table>
  </div></details>

  <details class="tool"><summary>La gara</summary><div class="tool-b">${stepsHTML(RACE.steps)}<p class="fuel"><b>Ristori e gel:</b> ${esc(RACE.fuel)}</p><p class="small muted" style="margin-top:8px">Percorso con 251 m di dislivello positivo, partenza e arrivo sul lungolago di Desenzano, tempo massimo 3 h 30'. Pettorale: sabato 9 gennaio 15:00–19:00 o domenica 7:45–9:15 in Piazza Malvezzi. Fonte: stragardalake.com (regolamento e programma).</p></div></details>

  <details class="tool"><summary>Protocolli e schede a casa</summary><div class="tool-b">${["prelungo", "mobilita", "casaA", "casaB", "nuotoA", "nuotoB"].map(k => protoHTML(PROTO[k])).join("")}</div></details>

  <details class="tool"><summary>Dati, export e backup</summary><div class="tool-b">
    <p class="small muted">I dati restano solo su questo telefono. Ultimo backup: ${last}. Fanne uno a settimana e salvalo su Drive.</p>
    <div class="btn-row"><button class="btn sm pri" data-act="backupshare">Condividi backup (Drive, mail…)</button><button class="btn sm" data-act="backup">Scarica backup .json</button><button class="btn sm" data-act="restore">Ripristina da backup</button></div>
    <div class="btn-row"><button class="btn sm" data-act="csvacts">Esporta attività (.csv)</button><button class="btn sm" data-act="csvplan">Esporta piano e registrazioni (.csv)</button></div>
    <p class="small muted" style="margin-top:10px">Il backup .json è il dataset completo e multisport (attività con split per km, registrazioni, modifiche del piano): è il file da dare a una futura app. Il .csv si apre con Excel o Fogli Google.</p>
    <div class="btn-row"><button class="btn sm danger" data-act="wipe">Cancella tutti i dati</button></div>
  </div></details>

  <details class="tool"><summary>Stampa scheda A4</summary><div class="tool-b"><p class="small muted">Tabella orizzontale con tutte le sedute, i target e le colonne per annotare a mano, più protocolli e schede a casa. Su Android scegli «Salva come PDF» o una stampante.</p><div class="btn-row"><button class="btn sm pri" data-act="print">Stampa o salva PDF</button></div></div></details>

  <p class="small muted" style="text-align:center;margin-top:18px">StraGarda 21K v${APP_V}${navigator.onLine ? "" : ", offline"}</p>`;
}

function renderAll() { buildPlan(); renderTop(); renderOggi(); renderPiano(); renderAttivita(); renderStrumenti(); }

/* ---------- foglio di registrazione ---------- */
let sheetSid = null;
function openLog(sid) {
  const s = sessById(sid); if (!s) return;
  sheetSid = sid;
  const L = state.logs[sid] || {}, acts = actsFor(sid);
  const rpe = RPE_L.map((t, i) => i ? `<option value="${i}" ${+L.rpe === i ? "selected" : ""}>${t}</option>` : `<option value="">Scegli</option>`).join("");
  const pain = Array.from({ length: 11 }, (_, i) => `<option value="${i}" ${+(L.pain || 0) === i ? "selected" : ""}>${i}${i === 0 ? " nessuno" : i >= 7 ? " forte" : ""}</option>`).join("");
  $("#sheetIn").innerHTML = `<div class="grab"></div>
    <p class="small muted">${fmtDayL(s.date)}, ${esc(GOAL_L[s.goal] || "")}</p><h3 style="font-size:1.4rem">${esc(s.title)}</h3>
    <p class="small muted" style="margin:4px 0 10px">Target: ${[isRun(s) && s.km ? nf(s.km) + " km" : "", s.durMin ? s.durMin + " min" : "", s.hr ? "FC " + s.hr : "", s.rpe ? "RPE " + s.rpe.join("–") : ""].filter(Boolean).map(esc).join(", ")}</p>
    ${acts.length ? `<p class="small" style="margin-bottom:8px">File collegato: ${acts.map(a => `${esc(a.name)} (${nf(a.distKm, 2)} km, ${fmtDur(a.durSec)})`).join("; ")}</p>` : ""}
    <div class="grid2">
      ${isRun(s) ? `<label class="field"><span>Distanza (km)</span><input type="number" step="0.01" inputmode="decimal" id="fKm" value="${L.km ?? ""}"></label>` : ""}
      <label class="field"><span>Durata (min)</span><input type="number" inputmode="numeric" id="fDur" value="${L.dur ?? ""}"></label>
      <label class="field"><span>FC media</span><input type="number" inputmode="numeric" id="fHr" value="${L.hr ?? ""}"></label>
      <label class="field"><span>Fatica percepita (RPE)</span><select id="fRpe">${rpe}</select></label>
      <label class="field"><span>Dolore ginocchia/caviglie</span><select id="fPain">${pain}</select></label>
    </div>
    <label class="field"><span>Note (sensazioni, meteo, scarpe…)</span><input type="text" id="fNote" value="${esc(L.note || "")}"></label>
    <p class="small muted">${s.goal === "quality" ? "Nelle sedute di qualità l'RPE giusto è medio-alto: troppo basso vuol dire che puoi alzare un po' i ritmi." : ["easy", "long", "strides", "swim", "recovery"].includes(s.goal) ? "Qui l'RPE deve restare basso: se sale, la seduta era troppo veloce." : "Valuta lo sforzo complessivo della seduta."}</p>
    <div class="btn-row"><button class="btn pri" data-act="savelog">Salva</button><button class="btn" data-act="uploadfor">Carica file .gpx/.tcx</button>${state.logs[sid] ? `<button class="btn ghost" data-act="clearlog">Azzera</button>` : ""}<button class="btn ghost" data-act="closesheet">Chiudi</button></div>`;
  $("#sheet").classList.add("on"); $("#sheetBg").classList.add("on");
}
function closeSheet() { $("#sheet").classList.remove("on"); $("#sheetBg").classList.remove("on"); sheetSid = null; setTimeout(() => { if (!sheetSid) $("#sheetIn").innerHTML = ""; }, 250); }
function saveLog() {
  const v = id => { const e = $(id); return e ? e.value.trim() : ""; };
  const L = state.logs[sheetSid] || {};
  const km = v("#fKm"), dur = v("#fDur"), hr = v("#fHr");
  L.km = km === "" ? undefined : +km.replace(",", "."); L.dur = dur === "" ? undefined : +dur; L.hr = hr === "" ? undefined : +hr;
  L.rpe = v("#fRpe") ? +v("#fRpe") : undefined; L.pain = +v("#fPain") || 0; L.note = v("#fNote");
  L.done = true; delete L.src;
  state.logs[sheetSid] = L; save(); closeSheet(); renderAll(); toast("Seduta registrata.");
}

/* ---------- stampa ---------- */
function buildPrint() {
  let rows = "";
  for (let w = 1; w <= NW; w++) {
    const info = WEEK_INFO[w] || {}, st = weekStats(w);
    rows += `<tr class="wk"><td colspan="11">Settimana ${w}: ${esc(info.t || "")}, ${nf(st.plannedKm)} km di corsa. ${esc(info.f || "")}</td></tr>`;
    PLAN.filter(d => d.w === w).forEach(d => d.sessions.forEach((s, i) => {
      const L = state.logs[s.id] || {};
      const det = (s.steps || []).map(x => `<b>${esc(x.t)}</b>${x.d ? ": " + esc(x.d) : ""}${x.list && x.list.length ? (/^(Protocollo ginocchia|Mobilità)/.test(x.t) ? " (vedi ultima pagina)" : " (" + x.list.map(esc).join("; ") + ")") : ""}`).join(" ");
      rows += `<tr><td>${i ? "" : `${WD[D(d.date).getDay()]} ${fmtDM(d.date)}`}</td><td><b>${esc(s.title)}</b><br>${esc(s.place || "")}</td><td>${esc(s.slot || "")}</td><td>${s.durMin || ""}${isRun(s) && s.km ? `<br>${nf(s.km)} km` : ""}</td><td>${esc(s.pace || "")}${s.speed ? "<br>" + esc(s.speed) : ""}</td><td>${esc(s.hr || "")}</td><td>${s.rpe ? s.rpe.join("–") : ""}</td><td style="width:34%">${det}${s.fuel ? `<br><i>${esc(s.fuel)}</i>` : ""}</td><td>${s.kind === "rest" ? "" : L.done ? "✓" : "☐"}</td><td>${L.km ?? ""}${L.hr ? `<br>FC ${L.hr}` : ""}</td><td>${L.rpe ?? ""}</td></tr>`;
    }));
  }
  $("#print").innerHTML = `<h1>${esc(PLAN_INFO.raceName)}: scheda di allenamento 26/10/2026 – 10/01/2027</h1>
    <p>Gara 10/01/2027 ore 9:50, Desenzano (251 m D+). Obiettivo ${esc(PLAN_INFO.goal)}. Zone: ${ZONES.map(z => `${z.k} ${z.hr} (${z.pace})`).join("; ")}. Tapis sempre all'1%. Il protocollo ginocchia pre-lungo è nell'ultima pagina.</p>
    <table><thead><tr><th>Giorno</th><th>Seduta</th><th>Orario</th><th>Min / km</th><th>Ritmo / velocità</th><th>FC</th><th>RPE</th><th>Dettaglio, bere e mangiare</th><th>Fatto</th><th>Km / FC reali</th><th>RPE reale</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="pg cols"><h3>${esc(PROTO.prelungo.title)} (${PROTO.prelungo.dur})</h3><ol>${PROTO.prelungo.list.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
    ${["mobilita", "casaA", "casaB", "nuotoA", "nuotoB"].map(k => { const P = PROTO[k]; return `<h3>${esc(P.title)} (${esc(P.dur)})</h3>${P.intro ? `<p>${esc(P.intro)}</p>` : ""}${P.total ? `<p><b>${esc(P.total)}</b></p>` : ""}${P.warm ? `<p>Riscaldamento: ${P.warm.map(esc).join("; ")}</p>` : ""}<ol>${P.list.map(x => `<li>${esc(x)}</li>`).join("")}</ol>`; }).join("")}</div>`;
}

/* ---------- interazioni ---------- */
let toastT;
function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), ms); }
function showTab(name) {
  $$(".view").forEach(v => v.classList.toggle("active", v.id === "v-" + name));
  $$(".tabs button").forEach(b => { if (b.dataset.tab === name) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  window.scrollTo(0, 0);
}
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; renderOggi(); });

document.addEventListener("click", async e => {
  const tab = e.target.closest(".tabs button");
  if (tab) { if (tab.dataset.tab === "piano") { renderPiano(); } showTab(tab.dataset.tab); if (tab.dataset.tab === "piano") { const t = $(`#d-${todayISO()}`); if (t && (state.ui.week || curWeek()) === curWeek()) t.scrollIntoView({ block: "start" }); window.scrollBy(0, -70); } return; }
  if (e.target === $("#sheetBg")) return closeSheet();
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, sid = el.dataset.sid, w = +el.dataset.w;
  switch (act) {
    case "toggle": { const L = state.logs[sid] || (state.logs[sid] = {}); L.done = !L.done; save(); renderAll(); break; }
    case "log": openLog(sid); break;
    case "closesheet": closeSheet(); break;
    case "savelog": saveLog(); break;
    case "clearlog": { actsFor(sheetSid).forEach(unlink); delete state.logs[sheetSid]; save(); closeSheet(); renderAll(); break; }
    case "uploadfor": $("#fileIn").click(); break;
    case "upload": $("#fileIn").click(); break;
    case "week": state.ui.week = w; save(); renderPiano(); window.scrollTo(0, 0); break;
    case "swap": state.swaps[w] = !state.swaps[w]; save(); renderAll(); toast(state.swaps[w] ? "Lungo spostato a sabato." : "Lungo di nuovo a domenica."); break;
    case "resetweek": if (confirm(`Ripristinare il piano originale della settimana ${w}? Le modifiche (regole o Claude) di quella settimana vanno perse; le registrazioni restano.`)) { resetWeek(w); save(); renderAll(); toast(`Settimana ${w} ripristinata.`); } break;
    case "print": buildPrint(); setTimeout(() => window.print(), 50); break;
    case "delact": { const a = state.acts.find(x => x.id === el.dataset.id); if (a && confirm(`Eliminare «${a.name}» del ${fmtDay(a.date)}?`)) { unlink(a); state.acts = state.acts.filter(x => x !== a); save(); renderAll(); toast("Attività eliminata."); } break; }
    case "goanalysis": analysisWeek = w; renderStrumenti(); showTab("strumenti"); break;
    case "applyrules": { const n = applyAnalysis(analyzeWeek(w)); state.reviewed[w] = true; save(); renderAll(); toast(`Settimana ${w + 1} adattata (${n} giorni modificati).`); break; }
    case "markreviewed": state.reviewed[w] = true; save(); renderAll(); toast(`Settimana ${w} segnata come analizzata.`); break;
    case "copysum": { const ok = await copyText(weekSummary(w)); toast(ok ? "Riepilogo copiato: incollalo nella chat con Claude." : "Copia non riuscita."); break; }
    case "preview": {
      const box = $("#updPrev");
      try {
        pendingUpdate = parseUpdate($("#updIn").value);
        box.innerHTML = `<div class="res"><h4>Aggiornamento valido</h4>${pendingUpdate.note ? `<p class="small">${esc(pendingUpdate.note)}</p>` : ""}<ul class="small" style="margin:6px 0 0 18px">${pendingUpdate.days.map(d => `<li>${fmtDay(d.date)}: ${d.sessions.map(s => esc(s.title)).join(" + ")}</li>`).join("")}</ul><div class="btn-row"><button class="btn sm pri" data-act="applyupdate">Applica al piano</button></div></div>`;
      } catch (err) { pendingUpdate = null; box.innerHTML = `<div class="res"><h4>Non valido</h4><p class="small">${esc(err.message)}. Copia l'intero blocco JSON della risposta.</p></div>`; }
      break;
    }
    case "applyupdate": {
      if (!pendingUpdate) break;
      pendingUpdate.days.forEach(d => { state.overrides[d.date] = { sessions: d.sessions, note: d.note || "", src: "Claude", at: new Date().toISOString(), why: pendingUpdate.note || "" }; });
      const ws = [...new Set(pendingUpdate.days.map(d => weekOf(d.date)))]; ws.forEach(x => { if (x > 1) state.reviewed[x - 1] = true; });
      save(); pendingUpdate = null; renderAll(); toast("Piano aggiornato."); break;
    }
    case "backup": exportBackup(false); renderStrumenti(); break;
    case "backupshare": exportBackup(true); renderStrumenti(); break;
    case "restore": $("#backupIn").click(); break;
    case "csvacts": if (!state.acts.length) toast("Nessuna attività da esportare."); else download(`stragarda21k_attivita_${stamp()}.csv`, csvActs(), "text/csv;charset=utf-8"); break;
    case "csvplan": download(`stragarda21k_piano_${stamp()}.csv`, csvPlan(), "text/csv;charset=utf-8"); break;
    case "wipe": if (confirm("Cancellare tutte le attività, registrazioni e modifiche? Esporta prima un backup.") && confirm("Confermi la cancellazione definitiva?")) { localStorage.removeItem(KEY); location.reload(); } break;
    case "install": if (installEvt) { installEvt.prompt(); await installEvt.userChoice; installEvt = null; renderOggi(); } break;
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "compact") { state.ui.compact = el.checked; save(); renderPiano(); }
  if (el.dataset.act === "aweek") { analysisWeek = +el.value; renderStrumenti(); $("#t-analysis").open = true; }
  if (el.dataset.act === "sport") { const a = state.acts.find(x => x.id === el.dataset.id); if (a) { unlink(a); a.sport = el.value; if (a.sport === "run" && a.distKm) a.paceSec = Math.round(a.durSec / a.distKm); autoLink(a); save(); renderAll(); } }
  if (el.dataset.act === "relink") { const a = state.acts.find(x => x.id === el.dataset.id); if (a) { linkTo(a, el.value); save(); renderAll(); toast(el.value ? "Attività collegata alla seduta." : "Collegamento rimosso."); } }
});
$("#fileIn").addEventListener("change", async e => { const f = e.target.files; await handleFiles(f); e.target.value = ""; if (sheetSid) openLog(sheetSid); });
$("#backupIn").addEventListener("change", async e => { if (e.target.files[0]) await importBackup(e.target.files[0]); e.target.value = ""; });
window.addEventListener("afterprint", () => { $("#print").innerHTML = ""; });

/* ---------- avvio ---------- */
load();
state.ui.week = null;
renderAll();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
let lastDay = todayISO();
document.addEventListener("visibilitychange", () => { if (!document.hidden && todayISO() !== lastDay) { lastDay = todayISO(); renderAll(); } });
</script>
</body>
</html>
